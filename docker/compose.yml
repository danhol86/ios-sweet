# Local-only experimental iOS SWEET QEMU runner. No proprietary OS files included.
services:
  ios-sweet:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ios-sweet-qemu:local
    init: true
    ports:
      - "127.0.0.1:${IOS_SWEET_VIEWER_PORT:-8108}:8099"
    environment:
      SWEET_QEMU_KERNEL: /guest/kernel.development.sweet
      SWEET_QEMU_DISK: /guest/ios.raw
      SWEET_QEMU_OVERLAY: /state/ios.qcow2
      SWEET_QEMU_OUTPUT_BASE: /state
      SWEET_QEMU_PORT: '8099'
      SWEET_QEMU_CPUS: ${IOS_SWEET_CPUS:-1}
      SWEET_QEMU_SECONDS: ${IOS_SWEET_SECONDS:-7200}
      SWEET_QEMU_NETWORK: ${IOS_SWEET_NETWORK:-0}
      SWEET_QEMU_NECP_TRACE: ${IOS_SWEET_NECP_TRACE:-0}
      SWEET_QEMU_PRODUCT_ADT: /guest/d22ap.adt
      SWEET_QEMU_LOG_FLAGS: guest_errors,unimp
    volumes:
      - ../:/app:ro
      - ${IOS_SWEET_KERNEL:?Set IOS_SWEET_KERNEL to an existing local kernel file}:/guest/kernel.development.sweet:ro
      - ${IOS_SWEET_DISK:?Set IOS_SWEET_DISK to an existing local raw iOS guest disk}:/guest/ios.raw:ro
      - ${IOS_SWEET_ADT:?Set IOS_SWEET_ADT to an extracted D22AP device tree}:/guest/d22ap.adt:ro
      - ${IOS_SWEET_STATE_DIR:?Set IOS_SWEET_STATE_DIR to an existing writable folder}:/state
    stop_grace_period: 45s
